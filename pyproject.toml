[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

# Настройки линтера ruff
# Для проверки uv run ruff check .
# Для автофикса uv run ruff check . --fix
# Для формотриование uv run ruff format .
# Для проверки типов uv run mypy .
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle ошибки
    "W",   # pycodestyle предупреждения
    "F",   # pyflakes (неиспользуемые импорты и т.д.)
    "I",   # isort (порядок импортов)
    "B",   # bugbear (частые баги)
    "UP",  # pyupgrade (современный синтаксис Python)
]
ignore = ["E501"]  # длинные строки не ругаемся

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]  # поддержка pydantic моделей
